<style>

::selection{background:var(--blue-soft);color:var(--text)}

.zd-sub,.zd-foot,.zd-note,.zd-caption{font-size:.75rem;color:var(--muted)}

.zd-filter-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;font-size:.75rem}

.zd-grid{display:grid;gap:16px;min-width:0;margin-top:16px}.zd-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.zd-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.zd-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.zd-stat{padding:17px 19px}.zd-stat-label{display:flex;align-items:center;gap:7px;font-size:.8125rem}
.zd-stat strong{display:block;font:600 1.875rem/1.3 Bahnschrift,"Aptos","Segoe UI",sans-serif;font-variant-numeric:tabular-nums;margin:13px 0 6px}
.zd-cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:19px 20px 12px}
.zd-cardhead p{margin-top:4px}.zd-cardbody{padding:6px 20px 20px;min-width:0}
.zd-cardfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 20px;font-size:.75rem}
.zd-insight{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border:1px solid var(--line);border-radius:8px;background:var(--blue-soft);margin-bottom:18px;font-size:.8125rem}
.zd-insight>.zd-icon{margin-top:3px}.zd-insight p{flex:1}
.zd-legend{gap:12px;margin:6px 0 12px;font-size:.75rem}.zd-legend button{font-size:inherit;border:1px solid transparent;background:transparent;padding:3px 5px}
.zd-dot{width:.55rem;height:.55rem;border-radius:2px;display:inline-block;flex:none;background:var(--zd-series)}
.zd-dot.line{height:2px;width:.85rem}.zd-legend .zd-off{border:1px dashed var(--muted);background:transparent!important}
.zd-chart-scroll{width:100%;max-width:100%;overflow:auto;overscroll-behavior-x:contain}
.zd-chart-scroll:focus-visible,.tablewrap:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.zd-chart{display:block;width:100%;min-width:53.125rem;aspect-ratio:850/260}
.zd-chart text{fill:var(--muted)}.zd-chart .zd-axis{stroke:var(--line);stroke-dasharray:4 5;stroke-width:1}
.zd-chart .zd-baseline{stroke:var(--zd-series);stroke-width:2;fill:none}.zd-chart .zd-countline{stroke:var(--zd-count);stroke-dasharray:7 5;stroke-width:2;fill:none}
.zd-chart-note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.75rem}

.zd-donut{position:relative;width:10rem;height:10rem;max-width:100%;margin:8px auto}
.zd-donut svg{width:100%;height:100%;display:block}.zd-donut circle{fill:none;stroke:var(--zd-track);stroke-width:17}
.zd-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.zd-donut-center strong{font-size:1.65rem;font-variant-numeric:tabular-nums}.zd-donut-center span{font-size:.75rem}
.zd-legend-list{display:grid;gap:11px;min-width:0}.zd-legend-row{display:flex;align-items:center;gap:8px;font-size:.8125rem}.zd-legend-row .name{flex:1}.zd-legend-row small{width:3.5rem;text-align:right;font-size:.75rem}
.zd-track{height:6px;border-radius:4px;background:var(--zd-track);min-width:24px}.zd-track i{display:block;height:100%;width:0}
.zd-bar-row{display:grid;grid-template-columns:minmax(5rem,1fr) minmax(3rem,2fr) 3rem;align-items:center;gap:12px;margin:16px 0;font-size:.8125rem}.zd-bar-row strong{text-align:right;font-variant-numeric:tabular-nums}
.zd-rank-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.zd-rank-row:last-child{border:0}.zd-rank-index{font-size:.75rem;width:1.4rem}
.zd-avatar{width:2.5rem;height:2.5rem;flex:none;border:1px dashed var(--muted);border-radius:50%;display:grid;place-items:center;background:var(--blue-soft)}
.zd-avatar .zd-icon{width:1.2rem;height:1.2rem}.zd-rank-body{flex:1;min-width:0}.zd-rank-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:.8125rem}
.tablewrap{width:100%;max-width:100%;overflow:auto;overscroll-behavior-x:contain}.zd-table{border-collapse:collapse;width:100%;min-width:40rem;font-size:.8125rem}
.zd-table th,.zd-table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.zd-table th{font-size:.75rem;font-weight:500;background:var(--blue-soft);white-space:nowrap}.zd-table .num{text-align:right;font-variant-numeric:tabular-nums}
.zd-table tfoot{background:var(--blue-soft)}.zd-table tfoot td{font-weight:600}.zd-table tr:last-child td{border-bottom:0}
.zd-table .zd-empty-cell{text-align:center;padding:26px 16px}.zd-table .zd-cell-note{display:block;font-size:.75rem;margin-top:3px;color:var(--muted)}
.zd-matrix{min-width:26rem}.zd-matrix td:not(:first-child){min-width:6rem;text-align:center}.zd-matrix strong{display:block;font-size:1rem}.zd-matrix small{font-size:.75rem}
.zd-caption{padding:10px 0 0}.zd-section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:24px 0 12px}
.zd-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.zd-toolbar label{font-size:.75rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}.zd-toolbar .zd-spacer{flex:1}
.zd-search{display:flex;gap:7px;flex-wrap:wrap}.zd-search input{width:15rem;min-width:0}
.zd-checks{padding:12px 0;border-top:1px solid var(--line);margin-top:4px;gap:8px 16px;font-size:.75rem}.zd-checks label{display:inline-flex;align-items:center;gap:6px}
.zd-account-grid,.zd-work-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.zd-account-placeholder,.zd-work-placeholder{border-style:dashed}
.zd-account-placeholder{padding:18px}.zd-placeholder-top{display:flex;align-items:center;gap:12px}.zd-placeholder-top h3{margin-bottom:3px}
.zd-field-line{display:flex;justify-content:space-between;gap:12px;font-size:.75rem;margin-top:10px}
.zd-account-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.zd-account-metrics strong{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}.zd-account-metrics span{font-size:.75rem}
.zd-placeholder-footer{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:16px;font-size:.75rem}
.zd-cover{aspect-ratio:16/8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--blue-soft);border-bottom:1px dashed var(--muted);font-size:.75rem}
.zd-cover .zd-icon{width:1.5rem;height:1.5rem}.zd-work-body{padding:16px}.zd-work-body h3{margin-bottom:10px}
.zd-pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:.75rem}.zd-pagination span{margin-right:auto}
.zd-mini-cover{width:4rem;height:2.5rem;flex:none;display:grid;place-items:center;background:var(--blue-soft);border:1px dashed var(--muted);border-radius:4px}.zd-placeholder-row td{height:78px}
.zd-compare-group{padding:10px 0 18px}.zd-compare-group:last-child{padding-bottom:0}.zd-compare-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8125rem;margin:10px 0 7px}
.zd-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:12px;padding:10px 0 20px}
.zd-flow-box{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--blue-soft);min-width:0}.zd-flow-box span{display:block;font-size:.75rem}.zd-flow-box strong{display:block;font-size:1.5rem;margin-top:6px}
.zd-rate-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:16px}
.zd-rate-grid span{display:block;font-size:.75rem}.zd-rate-grid strong{display:block;font-size:1.2rem;margin-top:6px}
.zd-audit-list{display:grid;gap:16px}.zd-audit-item{display:flex;align-items:flex-start;gap:10px}.zd-audit-item>.zd-icon{margin-top:3px}.zd-audit-item h3{margin-bottom:4px}
.zd-placeholder-track{height:22px;border-radius:5px;background:var(--zd-track);margin:18px 0}
.zd-footer{font-size:.75rem;border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
#app .zd-pivot-expanded .zd-table{min-width:70rem}
html[data-theme=dark]{--zd-series:#91b6ff;--zd-count:#ecc887;--zd-track:#2b405a}
html[data-theme=dark] #app :is(button,input,select){border-color:#7187a0}#app :is(button,input,select){caret-color:var(--blue)}
@media(min-width:1500px){.zd-metrics{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1000px){.zd-account-grid,.zd-work-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zd-donut-row{grid-template-columns:1fr}.zd-rate-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.zd-grid.two,.zd-grid.three{grid-template-columns:minmax(0,1fr)}.zd-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.zd-account-grid,.zd-work-grid{grid-template-columns:minmax(0,1fr)}#app>.topbar{align-items:flex-start}.zd-actions{justify-content:flex-start}.zd-cardhead{padding:16px 14px 10px}.zd-cardbody{padding:6px 14px 16px}.zd-cardfoot{padding:10px 14px}.zd-flow{grid-template-columns:1fr}.zd-flow>.zd-icon{transform:rotate(90deg);justify-self:center}.zd-rate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zd-filters{padding:12px}.zd-search input{width:100%}}
@media(max-width:420px){.zd-metrics{grid-template-columns:minmax(0,1fr)}.zd-toolbar{align-items:stretch}.zd-toolbar>label,.zd-toolbar>.zd-search{width:100%}.zd-toolbar select{max-width:100%}.zd-actions{width:100%}.zd-stat{padding:16px}.zd-donut-row{grid-template-columns:1fr}.zd-filter-group input[type=date]{width:8rem}.zd-pagination{justify-content:flex-start}.zd-rate-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px),(pointer:coarse){#app :is(button,select,input:not([type=checkbox])){min-height:44px}#app .zd-checks label{min-height:44px}}

.main{padding:0}.content{padding:29px 34px 24px;min-width:0}
.zd-metrics{grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
.zd-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.zd-step{padding:8px 0;min-width:0}.zd-step strong{display:block;margin:8px 0}
.zd-pivot-plain .zd-table tfoot{background:var(--paper)}
@media(max-width:1000px){.zd-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.zd-steps{grid-template-columns:1fr}}
</style>

<script>
"use strict";
/* Empty analytical presentation. Management records and historical snapshots stay separate. */
const PAGES={
 home:["发布效果总览","一眼看清发布表现、合作效率与用户反馈。"],
 overview:["全局透视","从发布时间、合作达人和层级，组合查看发布表现。"],

const COLORS=["#7193c5","#68a99b","#b8a0c8","#d5b17a","#9bb2cc","#ababbc"];
const ICONS={
 filter:'<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',chart:'<path d="M4 4v16h16M8 15v-4m4 4V7m4 8v-6"/>',video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',
 users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
 coins:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 4 16 4 16 0V6M4 12v6c0 4 16 4 16 0v-6"/>',rate:'<path d="m6 18 12-12"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
 heart:'<path d="M20.8 5.6a5.5 5.5 0 0 0-8 .3L12 7l-.8-1.1a5.5 5.5 0 0 0-8-.3C-1 10 6 16.5 12 21c6-4.5 13-11 8.8-15.4z"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',reset:'<path d="M3 10a9 9 0 1 1 2 9M3 4v6h6"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',document:'<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h6"/>',
 link:'<path d="m9 15 6-6m-7 9-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 6a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1"/>'
};
function esc(value){return String(value??"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function icon(name){return '<svg class="zd-icon" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||ICONS.document)+'</svg>';}
function monthRange(){
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit"}).formatToParts(new Date());
 const year=Number(parts.find(function(p){return p.type==="year";}).value),month=Number(parts.find(function(p){return p.type==="month";}).value);
 const prefix=year+"-"+String(month).padStart(2,"0")+"-";
 return {start:prefix+"01",end:prefix+new Date(Date.UTC(year,month,0)).getUTCDate()};
}
function button(text,action,value,pressed,symbol,extra){return '<button type="button" data-action="'+esc(action)+'" data-value="'+esc(value||"")+'"'+(typeof pressed==="boolean"?' aria-pressed="'+pressed+'"':"")+(extra||"")+'>'+(symbol?icon(symbol):"")+text+'</button>';}
function disabled(text,explanation,symbol){return '<button type="button" disabled title="'+esc(explanation)+'" aria-label="'+esc(text+"，"+explanation)+'">'+(symbol?icon(symbol):"")+esc(text)+'</button>';}
function select(label,key,values,selected){return '<label>'+esc(label)+'<select aria-label="'+esc(label)+'" data-control="'+key+'">'+Object.entries(values).map(function(entry){return '<option value="'+esc(entry[0])+'"'+(entry[0]===selected?" selected":"")+'>'+esc(entry[1])+'</option>';}).join("")+'</select></label>';}
function seg(items,action,current,label){return '<div class="zd-seg" role="group" aria-label="'+esc(label)+'">'+items.map(function(item){return button(esc(item[1]),action,item[0],current===item[0]);}).join("")+'</div>';}
function card(title,subtitle,body,tools,foot){return '<section class="card"><div class="zd-cardhead"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div>'+(tools||"")+'</div><div class="zd-cardbody">'+body+'</div>'+(foot?'<div class="zd-cardfoot">'+foot+'</div>':"")+'</section>';}
function stat(label,value,note,symbol){return '<section class="card zd-stat"><div class="zd-stat-label">'+icon(symbol)+esc(label)+'</div><strong>'+value+'</strong><div class="zd-note">'+esc(note)+'</div></section>';}
function metrics(items){return '<div class="zd-metrics">'+items.map(function(item){return stat.apply(null,item);}).join("")+'</div>';}
function notice(text){return '<div class="zd-insight">'+icon("info")+'<p>'+esc(text)+'</p></div>';}

function ticks(){
 const day=86400000,start=Date.parse(state.filters.start+"T00:00:00Z"),end=Date.parse(state.filters.end+"T00:00:00Z");
 if(state.trend==="week"){
  const boundaries=[start],weekday=new Date(start).getUTCDay(),untilMonday=(8-weekday)%7||7;
  for(let time=start+untilMonday*day;time<=end;time+=7*day)boundaries.push(time);
  const step=Math.max(1,Math.ceil(boundaries.length/7));
  return boundaries.filter(function(_,i){return i%step===0||i===boundaries.length-1;}).map(function(time,index){return new Date(time).toISOString().slice(5,10)+(index===0&&weekday!==1?"起":"周");});
 }
 return Array.from({length:7},function(_,i){return new Date(start+Math.round((end-start)*i/6/day)*day).toISOString().slice(5,10);}).filter(function(v,i,a){return a.indexOf(v)===i;});
}

function scaleChartText(){const size=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;document.querySelectorAll('.zd-chart').forEach(svg=>{const scale=svg.getScreenCTM()?.a||1;svg.querySelectorAll('text').forEach(t=>t.setAttribute('font-size',String(.75*size/scale)));});}
function render(){
 const info=PAGES[state.page];
 document.getElementById("app").innerHTML='<header class="topbar"><div><div class="eyebrow">KOL WORKSPACE</div><h1>'+info[0]+'</h1><p>'+info[1]+'</p></div><div class="zd-actions">'+(state.page!=="quality"?button("数据口径","nav","quality",undefined,"info"):'')+disabled("导出明细","当前没有可导出的发布记录","download")+'</div></header>'+
 (state.page!=="quality"?filterBar():'')+(state.error?'<div class="zd-error" role="alert">'+esc(state.error)+'</div>':'')+
 ({home:homePage,overview:overviewPage,creators:creatorsPage,content:contentPage,sentiment:sentimentPage,compare:comparePage,quality:qualityPage}[state.page])();
 document.title=info[0]+" · MIKOSHI";requestAnimationFrame(scaleChartText);

function navigate(page){if(!Object.hasOwn(PAGES,page))return;state.page=page;state.error="";history.replaceState(null,"","#"+page);render();window.scrollTo({top:0});}
function focusAction(a,v){[...document.querySelectorAll('[data-action]')].find(n=>n.dataset.action===a&&n.dataset.value===v)?.focus({preventScroll:true});}
function act(action,value){
 state.error="";
 if(action==="nav"){navigate(value);return;}
 if(action==="period"&&value==="month")Object.assign(state.filters,initialRange);
 else if(action==="reset")state.filters=defaultFilters();
 else if(action==="platform"&&["all","bili","douyin"].includes(value))state.platform=value;
 else if(action==="cost"&&["base","all"].includes(value))state.cost=value;
 else if(action==="cpm"&&["base","all","net"].includes(value))state.cpm=value;
 else if(action==="trend"&&["date","week"].includes(value))state.trend=value;
 else if(action==="series"&&["view","count","reservation"].includes(value)){const key={view:"showView",count:"showCount",reservation:"showReservations"}[value];state[key]=!state[key];}
 else if(action==="legend"&&FORMATS.includes(value))state.legend[value]=!state.legend[value];
 else if(action==="audience"&&["tier","direction"].includes(value))state.audience=value;
 else if(action==="audience-metric"&&["cost","view","fans"].includes(value))state.audienceMetric=value;
 else if(action==="library-mode"&&["creators","videos"].includes(value)){state.libraryMode=value;state.sort="view";}
 else if(action==="layout"&&["cards","table"].includes(value))state.layouts[state.libraryMode]=value;
 else if(action==="direction"&&["asc","desc"].includes(value))state.direction=value;
 else if(action==="pivot-style"&&["heat","bar","plain"].includes(value))state.pivot.style=value;
 else if(action==="pivot-chart")state.pivot.chart=!state.pivot.chart;
 else if(action==="reset-pivot"){state.pivot=defaultPivot();state.expanded=false;}
 else if(action==="expand")state.expanded=!state.expanded;
 else if(action==="compare-metric"&&["view","count","rate"].includes(value))state.compareMetric=value;
 else if(["search-library","search-content","search-comment"].includes(action)){
  const map={"search-library":["library-search","query"],"search-content":["content-search","contentQuery"],"search-comment":["comment-search","commentQuery"]},[id,key]=map[action],input=document.getElementById(id);
  if(!input)return;state[key]=input.value.trim().slice(0,160);render();document.getElementById(id)?.focus({preventScroll:true});return;
 }else if(action==="clear-search"&&["library-search","content-search","comment-search"].includes(value)){
  state[{"library-search":"query","content-search":"contentQuery","comment-search":"commentQuery"}[value]]="";render();document.getElementById(value)?.focus({preventScroll:true});return;
 }else return;
 render();focusAction(action,value);
}
function changeControl(node){
 const key=node.dataset.control,value=node.value;state.error="";
 if(key==="start"||key==="end"){
  const start=key==="start"?value:state.filters.start,end=key==="end"?value:state.filters.end;
  if(!validDate(value)||start>end)state.error="请选择有效日期，且开始日期不能晚于结束日期。";else state.filters[key]=value;
 }else if(key==="tier"&&Object.hasOwn(TIERS,value))state.filters.tier=value;
 else if(key==="format"&&["all",...FORMATS].includes(value))state.filters.format=value;
 else if(key==="sort"&&["view","count","fans","rate","date","reply"].includes(value))state.sort=value;
 else if(key==="pivot-row"&&Object.hasOwn(DIMS,value))state.pivot.row=value;
 else if(key==="pivot-col"&&(value==="metrics"||Object.hasOwn(DIMS,value)))state.pivot.col=value;
 else if(key==="pivot-metric"&&Object.hasOwn(METRICS,value)){
  const next=node.checked?[...new Set([...state.pivot.metrics,value])]:state.pivot.metrics.filter(m=>m!==value);
  if(next.length)state.pivot.metrics=next;else state.error="请至少保留一个透视指标。";
 }else if(key==="comment-target"&&["all","game","excluded"].includes(value))state.commentTarget=value;
 else if(key==="comment-stance"&&["all","positive","neutral","negative","pending"].includes(value))state.commentStance=value;
 else return;
 render();[...document.querySelectorAll('[data-control]')].find(n=>n.dataset.control===key&&(key!=="pivot-metric"||n.value===value))?.focus({preventScroll:true});
}
document.addEventListener("click",event=>{const node=event.target instanceof Element?event.target.closest('[data-action]'):null;if(node&&!node.disabled)act(node.dataset.action,node.dataset.value);});
document.addEventListener("change",event=>{const node=event.target instanceof Element?event.target.closest('[data-control]'):null;if(node)changeControl(node);});
document.addEventListener("keydown",event=>{const actions={"library-search":"search-library","content-search":"search-content","comment-search":"search-comment"};if(event.target instanceof HTMLInputElement&&Object.hasOwn(actions,event.target.id)&&event.key==="Enter"&&!event.isComposing){event.preventDefault();act(actions[event.target.id],"");}});
window.addEventListener("hashchange",()=>{const page=location.hash.slice(1);if(Object.hasOwn(PAGES,page)){state.page=page;render();}});
window.addEventListener("resize",scaleChartText);
new MutationObserver(()=>requestAnimationFrame(scaleChartText)).observe(document.documentElement,{attributes:true,attributeFilter:["style"]});
render();
</script>
